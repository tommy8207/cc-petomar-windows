name: Postav EXE
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Cislo verzie
        id: v
        shell: pwsh
        run: |
          $m = Select-String -Path Program.cs -Pattern 'VERZIA = (\d+);'
          $n = $m.Matches[0].Groups[1].Value
          "n=$n" >> $env:GITHUB_OUTPUT
      - name: Zostavit
        run: dotnet publish CCPetomar.csproj -c Release -o out
      - name: Premenovat
        shell: pwsh
        run: |
          Rename-Item out/CCPetomar.exe "cc-petomar-win-v${{ steps.v.outputs.n }}.exe"
          Get-ChildItem out
      - uses: actions/upload-artifact@v4
        with:
          name: cc-petomar-win-v${{ steps.v.outputs.n }}
          path: out/cc-petomar-win-v*.exe
      - name: Zverejnit (Release – odtial si ho stiahne cc-server)
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $t = "win-v${{ steps.v.outputs.n }}"
          $f = "out/cc-petomar-win-v${{ steps.v.outputs.n }}.exe"
          gh release view $t *> $null
          if ($LASTEXITCODE -eq 0) { gh release upload $t $f --clobber } else { gh release create $t $f --title "CC Petomar pre Windows v${{ steps.v.outputs.n }}" --notes "Automaticky zostavene z $env:GITHUB_SHA" --latest }
